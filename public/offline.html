<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PIM — sem conexão</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f6f3; color: #18181b; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #0c0d0f; color: #ededea; } p { color: #acacb2; } }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { margin: 0 0 24px; color: #52525b; line-height: 1.5; max-width: 320px; }
    button { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 15px;
      background: #0f766e; color: #fff; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sem conexão</h1>
    <p>Esta página ainda não foi aberta neste aparelho. As páginas que você já visitou continuam disponíveis offline.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
